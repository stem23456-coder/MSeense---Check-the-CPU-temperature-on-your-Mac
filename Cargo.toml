[package]
name = "msense"
version = "0.1.0"
edition = "2024"
description = "Apple Silicon CPU/GPU/RAM monitor with CLI and macOS menu bar app"
license = "MIT"

[[bin]]
name = "msense"
path = "src/bin/msense.rs"

[[bin]]
name = "msense-menu"
path = "src/bin/msense-menu.rs"

[target.'cfg(target_os = "macos")'.dependencies]
macmon = "0.8.2"
tray-icon = "0.21.1"
winit = "0.30"

[profile.release]
lto = true
codegen-units = 1
strip = true
